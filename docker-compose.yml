services:
  app:
    build: .
    container_name: ksipl-app-1
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ksipl-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: always
